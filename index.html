<title>คู่มือศึกษาสินค้า SPR99</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style id="page-style">
/* Layout: แอปมือถือ — หัวเว็บติดบน, แท็บล่าง (สินค้า / โปรโมชั่น), หน้าสินค้าเรียง ภาพ → สรุป 3 ข้อ → โปสเตอร์ → หัวข้อพับเปิดได้ */
:root{
  --bg:#f5f3fa; --surface:#ffffff; --surface-2:#eee9f8; --stage:#e7e0f7; --fg:#211a33; --muted:#655d7a; --line:#e1dbee;
  --accent:#6b46d9; --accent-2:#8d6ff0; --accent-fg:#ffffff; --accent-soft:#ece5fe; --accent-ink:#4b2db0;
  --gold:#a37a2c; --gold-soft:#f7eedb;
  --good:#17845a; --good-soft:#dff3ea; --warn:#a2610b; --warn-soft:#fbefd9; --off:#7a7489; --off-soft:#ecebf0; --agri:#2f8a55;
  --shadow:0 1px 2px rgb(33 26 51 / .05),0 10px 28px -14px rgb(75 45 176 / .22);
  --f-display:"Anuphan","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai","Anuphan",system-ui,-apple-system,"Segoe UI",sans-serif;
  --nav-h:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#130f1d; --surface:#1c162a; --surface-2:#251d37; --stage:#2a2143; --fg:#efebf8; --muted:#a8a1bd; --line:#30284a;
  --accent:#a78cff; --accent-2:#8e70f4; --accent-fg:#150e29; --accent-soft:#2c2250; --accent-ink:#cdbfff;
  --gold:#ddbd7f; --gold-soft:#33291a;
  --good:#5fd3a0; --good-soft:#163a2c; --warn:#f0b65c; --warn-soft:#3b2b12; --off:#9a94aa; --off-soft:#2a2636; --agri:#6fcf93;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 12px 30px -16px rgb(0 0 0 / .7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#130f1d; --surface:#1c162a; --surface-2:#251d37; --stage:#2a2143; --fg:#efebf8; --muted:#a8a1bd; --line:#30284a;
  --accent:#a78cff; --accent-2:#8e70f4; --accent-fg:#150e29; --accent-soft:#2c2250; --accent-ink:#cdbfff;
  --gold:#ddbd7f; --gold-soft:#33291a;
  --good:#5fd3a0; --good-soft:#163a2c; --warn:#f0b65c; --warn-soft:#3b2b12; --off:#9a94aa; --off-soft:#2a2636; --agri:#6fcf93;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 12px 30px -16px rgb(0 0 0 / .7); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:1rem;line-height:1.75;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);line-height:1.3;text-wrap:balance;margin:0}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:900px;margin:0 auto}
.muted{color:var(--muted)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;text-decoration:none;color:inherit}
.brand img{height:40px;width:auto;flex:none}
.brand .mk{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;background:linear-gradient(140deg,var(--accent-2),var(--accent));color:#fff;font-family:var(--f-display);font-weight:700}
.brand span{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.brand b{font-family:var(--f-display);font-weight:700;font-size:1rem;letter-spacing:.12em;color:var(--accent-ink)}
.brand small{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topnav{display:none;gap:4px}
.topnav a{padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500;font-size:.95rem}
.topnav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink)}
.fs{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface);flex:none}
.fs button{border:0;background:none;width:40px;height:38px;font-family:var(--f-display);font-weight:600;color:var(--fg)}
.fs button+button{border-left:1px solid var(--line)}
.fs button:disabled{opacity:.35}
.edit-toggle{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;height:38px;padding:0 12px;font-size:.875rem;font-weight:500;color:var(--muted);flex:none}
.edit-toggle[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.edit-toggle svg{width:16px;height:16px}

/* bottom tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(2,1fr);height:var(--nav-h)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--muted);font-size:.8rem;font-weight:500}
.tabbar svg{width:23px;height:23px}
.tabbar .pill{display:grid;place-items:center;width:60px;height:30px;border-radius:999px;transition:background .2s}
.tabbar a[aria-current="page"]{color:var(--accent)}
.tabbar a[aria-current="page"] .pill{background:var(--accent-soft)}
main{padding-block:20px calc(var(--nav-h) + 48px + env(safe-area-inset-bottom,0px))}
@media (min-width:760px){.topnav{display:flex}.tabbar{display:none}main{padding-block:32px 96px}}

/* common */
.stack{display:flex;flex-direction:column;gap:28px}
.eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.14em;color:var(--accent-ink);text-transform:uppercase}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;border:1px solid transparent;font-weight:600;font-size:.97rem;text-decoration:none;white-space:nowrap;background:none}
.btn svg{width:18px;height:18px;flex:none}
.btn-primary{background:var(--accent);color:var(--accent-fg)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--fg)}
.btn-soft{background:var(--accent-soft);color:var(--accent-ink)}
.btn-danger{color:#c2334a;border-color:color-mix(in srgb,#c2334a 40%,transparent)}
.btn-sm{min-height:38px;padding:0 13px;font-size:.875rem;border-radius:11px}
.icon-btn{width:38px;height:38px;display:inline-grid;place-items:center;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--muted);flex:none}
.icon-btn svg{width:17px;height:17px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head h2{font-size:1.3rem;font-weight:600;display:flex;align-items:center;gap:10px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.dot.agri{background:var(--agri)}
.count{font-size:.9rem;color:var(--muted)}
.empty{padding:36px 20px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:18px}
.editbar{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-radius:16px;border:1.5px dashed color-mix(in srgb,var(--accent) 45%,var(--line));background:var(--accent-soft)}
.editbar .lbl{width:100%;font-size:.8rem;font-weight:600;color:var(--accent-ink)}

/* home */
.intro h1{font-size:clamp(1.9rem,7vw,2.6rem);font-weight:700;margin-top:6px}
.intro p{color:var(--muted);font-size:1.06rem;margin-top:8px;max-width:58ch}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip-s{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:999px;font-size:.875rem;font-weight:500;background:var(--surface);border:1px solid var(--line)}
.chip-s.gold{background:var(--gold-soft);border-color:color-mix(in srgb,var(--gold) 35%,transparent);color:var(--gold)}
.chip-s svg{width:15px;height:15px}
.search{position:relative}
.search svg{position:absolute;left:15px;top:50%;translate:0 -50%;width:19px;height:19px;color:var(--muted)}
.search input{width:100%;height:52px;border-radius:15px;border:1px solid var(--line);background:var(--surface);padding:0 16px 0 46px;font-size:1rem}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:860px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pcard{display:flex;flex-direction:column;text-decoration:none;color:inherit;overflow:hidden;transition:transform .15s ease,box-shadow .2s}
.pcard:active{transform:scale(.98)}
.pcard .ph{height:150px;display:flex;align-items:flex-end;justify-content:center;padding:14px 10px 10px;background:radial-gradient(closest-side at 50% 55%,color-mix(in srgb,var(--accent-2) 22%,transparent),transparent),var(--stage)}
.pcard.agri .ph{background:radial-gradient(closest-side at 50% 55%,color-mix(in srgb,var(--agri) 22%,transparent),transparent),var(--stage)}
.pcard .ph img{max-height:126px;max-width:88%;object-fit:contain;filter:drop-shadow(0 10px 10px rgb(0 0 0 / .25))}
.pcard .pt{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.pcard b{font-family:var(--f-display);font-weight:600;font-size:1.02rem;line-height:1.35}
.pcard small{color:var(--muted);font-size:.85rem;line-height:1.45}
.noimg{display:grid;place-items:center;width:84px;height:84px;border-radius:20px;background:var(--surface);color:var(--muted)}
.noimg svg{width:34px;height:34px}

/* detail */
.back{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hero{overflow:hidden}
.hero-stage{position:relative;height:250px;display:flex;align-items:flex-end;justify-content:center;padding:20px;background:radial-gradient(closest-side at 50% 58%,color-mix(in srgb,var(--accent-2) 30%,transparent),transparent),var(--stage)}
.hero.agri .hero-stage{background:radial-gradient(closest-side at 50% 58%,color-mix(in srgb,var(--agri) 30%,transparent),transparent),var(--stage)}
.hero-stage>img.main{max-height:212px;max-width:80%;object-fit:contain;filter:drop-shadow(0 18px 16px rgb(0 0 0 / .3))}
.hero-stage .badge{position:absolute;top:14px;right:14px;width:84px;height:84px;object-fit:contain}
.hero-info{padding:20px;display:flex;flex-direction:column;gap:8px}
.hero-info h1{font-size:clamp(1.6rem,6vw,2.1rem);font-weight:700}
.hero-info .th{color:var(--muted);font-size:1rem}
.hero-info .desc{font-size:1.06rem;margin-top:4px;max-width:62ch}
.specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.spec{padding:11px 13px;border-radius:13px;background:var(--surface-2);min-width:0}
.spec .l{font-size:.8rem;color:var(--muted)}
.spec .v{font-weight:600;font-size:.97rem;line-height:1.45;overflow-wrap:anywhere}
@media (min-width:760px){.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr)}.hero-stage{height:auto;min-height:340px;align-items:center}.hero-info{padding:28px}}
.certs{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px 22px;padding:14px;border-radius:16px;background:#ffffff;border:1px solid var(--line)}
.certs img{height:56px;width:auto;max-width:100%;object-fit:contain}
.summary{padding:20px;border-radius:18px;background:linear-gradient(180deg,var(--accent-soft),color-mix(in srgb,var(--accent-soft) 35%,var(--surface)));border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line))}
.summary h2{font-size:.85rem;font-weight:600;letter-spacing:.1em;color:var(--accent-ink);margin-bottom:12px}
.summary ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.summary li{display:flex;gap:13px;align-items:flex-start;font-size:1.06rem}
.summary li i{font-style:normal;flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-fg);font-family:var(--f-display);font-weight:700;font-size:.9rem;margin-top:1px}
.gallery{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin-inline:-4px;padding-inline:4px;scrollbar-width:thin}
.poster{flex:0 0 72%;max-width:320px;scroll-snap-align:start;position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);padding:0}
.poster img{display:block;width:100%;height:auto}
.poster .tools{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:6px;justify-content:flex-end}
.poster .tools .icon-btn{background:color-mix(in srgb,var(--surface) 92%,transparent)}
.poster-add{flex:0 0 46%;max-width:200px;min-height:200px;scroll-snap-align:start;border:1.5px dashed color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:16px;background:var(--accent-soft);color:var(--accent-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:.9rem}
.poster-add svg{width:26px;height:26px}
.acc{display:flex;flex-direction:column;gap:10px}
.sec{overflow:hidden}
.sec-btn{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:none;border:0;padding:16px 16px 16px 20px;min-height:64px}
.sec-btn span{flex:1;min-width:0;font-family:var(--f-display);font-weight:600;font-size:1.06rem;line-height:1.4}
.sec-btn svg{width:20px;height:20px;color:var(--muted);transition:rotate .2s;flex:none}
.sec.open .sec-btn svg{rotate:180deg}
.sec-body{padding:0 20px 20px;display:flex;flex-direction:column;gap:14px}
.sec-img{border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.sec-img img{display:block;width:100%;height:auto}
.prose{display:flex;flex-direction:column;gap:12px;font-size:1.02rem}
.prose ul,.prose ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.prose li{display:flex;gap:12px;align-items:flex-start}
.prose li>.mk{flex:none;margin-top:9px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.prose ol>li>.mk{margin-top:1px;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:.85rem}
.prose li>.ing{flex:none;width:46px;height:46px;border-radius:12px;background-color:#fff;background-repeat:no-repeat;background-size:auto 46px;border:1px solid var(--line)}
.prose li>.tx{flex:1;min-width:0;display:flex;flex-direction:column}
.prose .tt{font-weight:600;color:var(--fg)}
.prose .dd{color:var(--muted)}
.prose .sub{display:block;color:var(--muted);font-size:.95rem}
.prose .sub b{color:var(--fg);font-weight:600}
.prose strong{font-weight:600}
.ph-fill{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:0 5px}
.note{display:flex;gap:12px;padding:16px 18px;border-radius:16px;background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 30%,transparent)}
.note svg{width:20px;height:20px;color:var(--gold);flex:none;margin-top:4px}
.note b{display:block;color:var(--gold);font-size:.9rem}
.note p{font-size:.97rem}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pager a{display:flex;flex-direction:column;gap:2px;padding:14px 16px;text-decoration:none;color:inherit;min-width:0}
.pager a.next{text-align:right}
.pager small{color:var(--muted);font-size:.8rem}
.pager b{font-family:var(--f-display);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* promo */
.ftabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.ftabs::-webkit-scrollbar{display:none}
.ftab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;font-size:.92rem;font-weight:500;color:var(--muted);white-space:nowrap}
.ftab[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.ftab .n{opacity:.6;margin-left:5px}
.promos{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:640px){.promos{grid-template-columns:repeat(2,minmax(0,1fr))}}
.promo{display:flex;flex-direction:column;overflow:hidden}
.promo-img{position:relative;background:var(--surface-2);border:0;padding:0;display:block;width:100%}
.promo-img img{display:block;width:100%;height:auto}
.promo-top{position:relative;padding:22px 18px 18px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
.promo.ended .promo-top{background:linear-gradient(135deg,#6f6a80,#8d889c)}
.promo-top b{font-family:var(--f-display);font-weight:700;font-size:1.9rem;line-height:1.15;display:block;overflow-wrap:anywhere;padding-right:96px}
.promo .status{position:absolute;top:12px;right:12px}
.status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600;white-space:nowrap}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-active{background:var(--good-soft);color:var(--good)}
.st-soon{background:var(--warn-soft);color:var(--warn)}
.st-ended{background:var(--off-soft);color:var(--off)}
.promo-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.promo-body h3{font-size:1.15rem;font-weight:600}
.promo-body .d{color:var(--muted)}
.period{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}
.period svg{width:16px;height:16px;flex:none}
.code{display:flex;align-items:center;gap:10px;border:1.5px dashed color-mix(in srgb,var(--accent) 50%,var(--line));border-radius:13px;padding:6px 6px 6px 14px;background:var(--accent-soft)}
.code span{flex:1;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600;letter-spacing:.06em;color:var(--accent-ink);overflow-wrap:anywhere}
.rel{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--surface-2);text-decoration:none;color:inherit;font-size:.9rem}
.rel img{width:36px;height:36px;object-fit:contain}
.rel span{flex:1;min-width:0}
.rel svg{width:16px;height:16px;color:var(--muted)}
details.cond summary{cursor:pointer;font-size:.9rem;font-weight:500;color:var(--accent-ink);list-style:none;display:flex;align-items:center;gap:6px}
details.cond summary::-webkit-details-marker{display:none}
details.cond summary svg{width:16px;height:16px;transition:rotate .2s}
details.cond[open] summary svg{rotate:180deg}
details.cond .prose{margin-top:8px;font-size:.93rem}

/* save bar, sheet, lightbox, toast */
.savebar{position:fixed;z-index:25;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding-bottom:10px;pointer-events:none}
.savebar .in{pointer-events:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--fg);color:var(--bg);border-radius:16px;padding:10px 10px 10px 16px;box-shadow:0 12px 30px -10px rgb(0 0 0 / .45)}
.savebar .msg{flex:1 1 140px;font-size:.92rem;font-weight:500}
.savebar .b-cancel{color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent)}
.savebar .b-save{background:var(--accent-2);color:#fff}
@media (min-width:760px){.savebar{bottom:max(20px,env(safe-area-inset-bottom,0px))}}
.overlay{position:fixed;inset:0;z-index:40;background:rgb(18 12 34 / .55);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}

*\n  1.92 มก.: Titanium Dioxide (สีของเปลือกแคปซูล)","sprite":"assets/ingredients-lady.webp","spriteN":13},{"id":"s3","title":"วิธีรับประทาน 3 ขั้นตอน","body":"1. **ทาน 1 แคปซูล** วันละ 1 ครั้ง\n2. **ทานก่อนนอนหรือตอนท้องว่าง** เวลาที่แนะนำคือประมาณ 23:30 น.\n3. **ทานต่อเนื่อง** เพื่อให้ร่างกายดูดซึมได้ดีที่สุด"},{"id":"s4","title":"ผลลัพธ์จากภายในสู่ภายนอก","body":"- **สมดุลของร่างกาย**\n  กระบวนการ: ปรับสมดุล บำรุงระบบภายใน\n  สู่ภายนอก: ผิวสดใส เปล่งปลั่ง\n- **การดูแลภายใน**\n  กระบวนการ: ฟื้นฟูร่างกาย\n  สู่ภายนอก: สุขภาพดีขึ้น แข็งแรง\n- **สัญญาณแห่งวัย**\n  กระบวนการ: ต้านอนุมูลอิสระ ชะลอความเสื่อม\n  สู่ภายนอก: ผิวแข็งแรง ดูอ่อนเยาว์"}],"note":{"title":"ข้อควรระวังเวลาแนะนำสินค้า","text":"เป็นผลิตภัณฑ์เสริมอาหาร ไม่ใช่ยา ไม่ควรกล่าวว่าป้องกันหรือรักษาโรคได้ ผลลัพธ์ขึ้นอยู่กับแต่ละบุคคล และควรรับประทานอาหารหลากหลายครบ 5 หมู่ควบคู่กัน"},"posters":["assets/poster-12.webp","assets/poster-13.webp","assets/poster-14.webp","assets/poster-15.webp","assets/poster-16.webp"]},{"id":"colla","cat":"health","name":"LOVE COLLA","th":"เลิฟ คอลล่า คอลลาเจนยุคใหม่","eyebrow":"ผลิตภัณฑ์เสริมอาหาร","desc":"คอลลาเจนเปปไทด์จากปลา ผสานนวัตกรรม FIR ที่ช่วยให้โมเลกุลมีขนาดเล็ก ร่างกายจึงดูดซึมและนำไปใช้ได้ดี ไม่มีน้ำตาล","img":"assets/colla.webp","badgeImg":"","specs":[{"label":"รูปแบบ","value":"ผงชงดื่ม แบบซอง"},{"label":"บรรจุ","value":"10 ซอง ต่อกล่อง"},{"label":"คอลลาเจน","value":"10,000 มก. ต่อซอง"},{"label":"น้ำตาล","value":"0%"},{"label":"มาตรฐาน","value":"ฮาลาล"}],"certs":[],"summaryTitle":"สรุปสั้น ๆ จำ 3 ข้อนี้","summary":["จุดต่างคือนวัตกรรม FIR ที่ทำให้โมเลกุลคอลลาเจนเล็กลง ดูดซึมได้ดี","คอลลาเจนจากปลา 10,000 มก. ต่อซอง รวม 100,000 มก. ต่อกล่อง","มีสารสกัดจากธรรมชาติมากกว่า 16 ชนิด และไม่มีน้ำตาล"],"sections":[{"id":"s1","title":"FIR คืออะไร","body":"FIR ย่อมาจาก Far Infrared Ray คือคลื่นพลังงานความร้อนลึกที่กระตุ้นการสั่นสะเทือนของโมเลกุล ทำให้โมเลกุลแตกตัวมีขนาดเล็กลง ร่างกายจึงดูดซึมได้ง่ายและรวดเร็วขึ้น"},{"id":"s2","title":"นวัตกรรม FIR ทำงานอย่างไร","body":"- **1. คลื่น FIR** ให้พลังงานความร้อนลึกกับโมเลกุลคอลลาเจน\n- **2. โมเลกุลเล็กลง** โมเลกุลสั่นสะเทือนและแตกตัวจนมีขนาดเล็ก\n- **3. ดูดซึมง่าย** ร่างกายดูดซึมได้ง่ายและรวดเร็วขึ้น"},{"id":"s3","title":"เปรียบเทียบให้เห็นภาพ","body":"- **ขนาดโมเลกุล**\n  คอลลาเจนทั่วไป (ไม่มี FIR): โมเลกุลขนาดใหญ่\n  LOVE COLLA + FIR: โมเลกุลเล็กระดับจิ๋ว\n- **การดูดซึม**\n  คอลลาเจนทั่วไป (ไม่มี FIR): ผ่านได้น้อย ดูดซึมได้ยาก\n  LOVE COLLA + FIR: ผ่านได้ง่าย ดูดซึมเร็วและลึก\n- **การนำไปใช้**\n  คอลลาเจนทั่วไป (ไม่มี FIR): ร่างกายนำไปใช้ได้น้อย\n  LOVE COLLA + FIR: ร่างกายนำไปใช้ได้เต็มประสิทธิภาพ"},{"id":"s4","title":"ส่วนประกอบสำคัญ","body":"คอลลาเจนเปปไทด์จากปลา (Fish Collagen Peptide) 10,000 มก. ต่อซอง ผสานสารสกัดและสารอาหารอีก 12 ชนิด\n\n- ทับทิม\n- อะเซโรลาเชอร์รี่\n- มะขามป้อม\n- โรสฮิป\n- เมล็ดองุ่น\n- โกจิเบอร์รี่\n- สาหร่ายฮีมาโตคอคคัส\n- เปลือกสน\n- แอปเปิ้ล\n- แอล-กลูตาไธโอน\n- แอล-อาร์จินีน\n- โคเอนไซม์คิวเทน","sprite":"assets/ingredients-colla.webp","spriteN":12},{"id":"s5","title":"คุณสมบัติ 8 ด้าน","body":"1. **ดูแลผิวพรรณ** ช่วยให้ผิวดูใส เปล่งปลั่ง สุขภาพดี\n2. **ผิวดูกระจ่างใส** ช่วยให้สีผิวดูสม่ำเสมอ\n3. **ผิวชุ่มชื้น** ช่วยเพิ่มความชุ่มชื้นให้ผิวดูอิ่มน้ำ\n4. **กระชับผิว** ช่วยให้ผิวดูเรียบเนียน กระชับขึ้น\n5. **บำรุงเส้นผม** ช่วยให้เส้นผมดูแข็งแรง\n6. **บำรุงเล็บ** ช่วยให้เล็บดูแข็งแรง ไม่เปราะง่าย\n7. **บำรุงกระดูก** มีส่วนช่วยในการสร้างและคงสภาพของกระดูก\n8. **เสริมความแข็งแรงของร่างกาย** มีส่วนช่วยเสริมสร้างภูมิคุ้มกัน"},{"id":"s6","title":"เหมาะสำหรับผู้ที่มีปัญหาเหล่านี้","body":"- ผิวหมองคล้ำ ไม่กระจ่างใส\n- รูขุมขนกว้าง ผิวไม่เรียบเนียน\n- ริ้วรอยก่อนวัย ผิวไม่กระชับ\n- ผมแห้งเสีย เล็บเปราะ\n- ต้องการบำรุงกระดูกและข้อ"},{"id":"s7","title":"วิธีรับประทาน","body":"[ระบุวิธีชงและจำนวนซองต่อวันตามฉลาก]"}],"note":{"title":"ข้อควรระวังเวลาแนะนำสินค้า","text":"เป็นผลิตภัณฑ์เสริมอาหาร ไม่ใช่ยา ไม่ควรกล่าวว่าป้องกันหรือรักษาโรคได้ ผลลัพธ์ขึ้นอยู่กับแต่ละบุคคล และควรรับประทานอาหารหลากหลายครบ 5 หมู่ควบคู่กัน"},"posters":["assets/poster-04.webp","assets/poster-05.webp","assets/poster-06.webp","assets/poster-07.webp"]},{"id":"coffee","cat":"health","name":"LOVER Coffee 39in1","th":"เลิฟเวอร์ คอฟฟี่","eyebrow":"กาแฟเพื่อสุขภาพ","desc":"กาแฟปรุงสำเร็จชนิดผง ใช้กาแฟอาราบิก้าจากบราซิล ผสมสมุนไพรและสารอาหาร รวม 39 คุณประโยชน์ในซองเดียว หอม อร่อย กลมกล่อม ไม่ใส่น้ำตาล","img":"assets/coffee.webp","badgeImg":"","specs":[{"label":"รูปแบบ","value":"กาแฟผงชงดื่ม"},{"label":"บรรจุ","value":"10 ซอง × 15 กรัม"},{"label":"น้ำหนักสุทธิ","value":"150 กรัม"},{"label":"มาตรฐาน","value":"ฮาลาล"}],"certs":[],"summaryTitle":"สรุปสั้น ๆ จำ 3 ข้อนี้","summary":["กาแฟเพื่อสุขภาพ 39 in 1 ดื่มง่ายได้ทุกวัน","ไม่ใส่น้ำตาล ไม่มีคอเลสเตอรอล พลังงานต่ำ","ส่วนผสมพิเศษคือเทียนดำ (Black Cumin) ร่วมกับเห็ดหลินจือ โสม และตังกุย"],"sections":[{"id":"s1","title":"ส่วนประกอบเด่น","body":"- **กาแฟอาราบิก้าจากบราซิล** ให้กลิ่นหอมและรสชาติกลมกล่อม\n- **ผงเทียนดำ (Black Cumin)** ส่วนผสมพิเศษ อุดมด้วยสารต้านอนุมูลอิสระ\n- **สารสกัดเห็ดหลินจือ** สมุนไพรบำรุงร่างกาย\n- **สารสกัดโสม** สมุนไพรบำรุงร่างกาย เพิ่มความสดชื่น\n- **สารสกัดตังกุย** สมุนไพรบำรุงร่างกาย\n- **ผงน้ำหญ้าข้าวสาลี** แหล่งใยอาหารจากธรรมชาติ\n- **แคลเซียม อะมิโน แอซิด คีเลต** แหล่งแคลเซียม บำรุงกระดูกและฟัน","sprite":"assets/ingredients-coffee.webp","spriteN":6},{"id":"s2","title":"จุดเด่น 5 ด้าน","body":"1. **ไม่มีน้ำตาล** ไม่ให้พลังงานส่วนเกิน เหมาะกับผู้ที่ควบคุมน้ำหนัก\n2. **ดูแลระบบขับถ่าย** มีใยอาหารจากธรรมชาติ\n3. **บำรุงสายตา** มีลูทีนและซีแซนทีนจากดอกดาวเรือง\n4. **แคลเซียมสูง** บำรุงกระดูกและฟัน\n5. **เพิ่มความสดชื่น** ดื่มแล้วกระปรี้กระเปร่า พลังงานพอเหมาะ"},{"id":"s3","title":"เหมาะสำหรับ","body":"- ผู้ที่ดื่มกาแฟเป็นประจำและใส่ใจสุขภาพ\n- ผู้ที่ต้องการลดน้ำตาล\n- ผู้ใหญ่และผู้สูงอายุที่ต้องการเสริมแคลเซียม"},{"id":"s4","title":"วิธีชง","body":"[ระบุปริมาณน้ำร้อนต่อ 1 ซองตามฉลาก]"}],"note":{"title":"ข้อควรระวังเวลาแนะนำสินค้า","text":"เป็นผลิตภัณฑ์เสริมอาหาร ไม่ใช่ยา ไม่ควรกล่าวว่าป้องกันหรือรักษาโรคได้ ผลลัพธ์ขึ้นอยู่กับแต่ละบุคคล และควรรับประทานอาหารหลากหลายครบ 5 หมู่ควบคู่กัน"},"posters":["assets/poster-17.webp","assets/poster-18.webp","assets/poster-19.webp"]},{"id":"x2","cat":"health","name":"2X","th":"ทูเอ็กซ์ สูตรสมุนไพรเข้มข้น","eyebrow":"ผลิตภัณฑ์เสริมอาหาร","desc":"ผลิตภัณฑ์เสริมอาหารสำหรับคุณผู้ชาย รวมสมุนไพรและสารอาหาร 7 ชนิด เพื่อเสริมพลังและดูแลร่างกายให้พร้อมในทุกวัน","img":"assets/2x.webp","badgeImg":"","specs":[{"label":"รูปแบบ","value":"เม็ด"},{"label":"บรรจุ","value":"10 เม็ด ต่อกล่อง"},{"label":"น้ำหนักสุทธิ","value":"12 กรัม"},{"label":"เลข อย.","value":"24-1-09957-5-0021"},{"label":"มาตรฐาน","value":"ฮาลาล"}],"certs":[],"summaryTitle":"สรุปสั้น ๆ จำ 3 ข้อนี้","summary":["สินค้าสำหรับผู้ชาย สูตรสมุนไพรเข้มข้น","จำง่าย ๆ ว่า “7 พลัง จาก 7 ส่วนประกอบ”","บรรจุกล่องละ 10 เม็ด ได้รับมาตรฐานฮาลาล"],"sections":[{"id":"s1","title":"ส่วนประกอบ 7 ชนิด","body":"- **โสม** ลดความอ่อนเพลีย บำรุงร่างกาย\n- **ถั่งเช่า** เพิ่มพลังงาน เสริมภูมิคุ้มกัน\n- **กระชายดำ** ช่วยเรื่องการไหลเวียนเลือด เสริมความกระฉับกระเฉง\n- **เห็ดหลินจือ** เสริมภูมิคุ้มกัน บำรุงร่างกาย\n- **แอล-คาร์นิทีน** ต้านอนุมูลอิสระ ช่วยการเผาผลาญ\n- **สารสกัดจากหอยนางรม** เสริมภูมิคุ้มกัน บำรุงร่างกาย\n- **ซิงค์ อะมิโน แอซิด คีเลต** เสริมภูมิคุ้มกัน บำรุงร่างกาย","sprite":"assets/ingredients-x2.webp","spriteN":7},{"id":"s2","title":"7 พลังแห่ง 2X","body":"1. **เพิ่มพลังงาน** ช่วยให้ร่างกายมีพลัง ไม่อ่อนเพลีย\n2. **การไหลเวียนเลือด** ส่งเสริมการไหลเวียนทั่วร่างกาย\n3. **เสริมภูมิคุ้มกัน** ช่วยเสริมสร้างภูมิคุ้มกันของร่างกาย\n4. **ฟื้นฟูร่างกาย** ช่วยให้ร่างกายฟื้นตัวเร็วขึ้น ลดความอ่อนล้า\n5. **บำรุงสมอง** ส่งเสริมการทำงานของสมอง สมาธิ และความจำ\n6. **เพิ่มความกระฉับกระเฉง** ช่วยให้รู้สึกกระปรี้กระเปร่า พร้อมลุยทุกกิจกรรม\n7. **สมุนไพรธรรมชาติ** สารสกัดจากสมุนไพรเข้มข้น"},{"id":"s3","title":"วิธีรับประทาน","body":"[ระบุจำนวนเม็ดต่อวันและเวลาที่แนะนำตามฉลาก]"}],"note":{"title":"ข้อควรระวังเวลาแนะนำสินค้า","text":"เป็นผลิตภัณฑ์เสริมอาหาร ไม่ใช่ยา ไม่ควรกล่าวว่าป้องกันหรือรักษาโรคได้ ผลลัพธ์ขึ้นอยู่กับแต่ละบุคคล และควรรับประทานอาหารหลากหลายครบ 5 หมู่ควบคู่กัน"},"posters":["assets/poster-01.webp","a มาร์ล 40% คาร์บอนแบล็ค 40% ฮิวมิค 10% โดโลไมท์ 10%","ผสมกับปุ๋ยเคมีได้ ช่วยลดต้นทุนการใช้ปุ๋ย"],"sections":[{"id":"s1","title":"ส่วนประกอบสำคัญ","body":"- **ปูนมาร์ล 40%** ปรับโครงสร้างดิน ปรับสภาพความเป็นกรด-ด่าง\n- **คาร์บอนแบล็ค 40%** เพิ่มการดูดซึมธาตุอาหาร ช่วยกักเก็บน้ำ\n- **ฮิวมิค แอซิด 10%** ปรับปรุงโครงสร้างดิน กระตุ้นการเจริญเติบโตของราก\n- **โดโลไมท์ 10%** ปรับสมดุลความเป็นกรด-ด่าง ให้แคลเซียมและแมกนีเซียม"},{"id":"s2","title":"ประโยชน์ของปูนมาร์ล","body":"1. **ปรับสภาพความเป็นกรด-ด่างของดิน** ช่วยให้ดินเหมาะสมกับการเจริญเติบโตของพืช\n2. **เป็นแหล่งธาตุอาหารพืช** มีแคลเซียม แมกนีเซียม และแร่ธาตุอื่น ๆ ที่จำเป็น\n3. **ปรับปรุงโครงสร้างดิน** ทำให้ดินร่วนซุย ระบายน้ำดี ไม่อัดแน่น\n4. **ลดความแน่นของดิน** รากพืชชอนไชและเจริญเติบโตได้ดี\n5. **เพิ่มประสิทธิภาพการใช้ปุ๋ย** ป้องกันการสูญเสียปุ๋ยไปกับน้ำ และเพิ่มการดูดซึม"},{"id":"s3","title":"ประโยชน์ของคาร์บอนแบล็ค","body":"1. **ปรับปรุงคุณภาพดิน** ดินร่วนซุยขึ้น รากพืชแทรกตัวและดูดซึมธาตุอาหารได้ดี\n2. **เพิ่มความสามารถในการกักเก็บน้ำ** ช่วยเก็บความชื้นในดิน ลดการให้น้ำบ่อยครั้ง\n3. **เพิ่มการดูดซึมธาตุอาหาร** ช่วยให้พืชดูดซึมแร่ธาตุได้ดีขึ้น\n4. **ลดการชะล้างของดิน** ดินจับตัวดีขึ้น ไม่พังทลายง่าย\n5. **ช่วยดูดซับคาร์บอนส่วนเกินในดิน** ลดผลกระทบจากภาวะโลกร้อน"},{"id":"s4","title":"ประโยชน์ของสารฮิวมิค","body":"1. **ปรับปรุงโครงสร้างดิน** ดินร่วนซุย ระบายน้ำและอากาศได้ดี\n2. **เพิ่มความสามารถในการอุ้มน้ำ** ดินเก็บความชื้นได้นานขึ้น พืชทนแล้งได้ดีขึ้น\n3. **เพิ่มการดูดซึมธาตุอาหาร** ช่วยจับธาตุอาหารไว้ในดิน ไม่ให้ถูกชะล้าง\n4. **กระตุ้นการเจริญเติบโตของราก** รากแขนงออกมากขึ้น รากยาวและแตกกอดี\n5. **ลดความเป็นพิษของสารเคมีในดิน** ลดผลตกค้างของสารเคมีหรือโลหะหนัก\n6. **เพิ่มจุลินทรีย์ที่เป็นประโยชน์** กระตุ้นจุลินทรีย์ให้ย่อยอินทรียวัตถุในดินได้ดี"},{"id":"s5","title":"ประโยชน์ของแร่โดโลไมท์","body":"1. **ปรับค่าความเป็นกรด-ด่างของดิน** มีฤทธิ์เป็นด่างเล็กน้อย ช่วยให้พืชดูดธาตุอาหารได้ดีขึ้น\n2. **ปรับปรุงคุณภาพผลผลิต** ช่วยเรื่องขนาด สี รสชาติ และคุณภาพโดยรวมของผลไม้และผัก\n3. **ช่วยการเจริญเติบโตของราก** แมกนีเซียมช่วยส่งเสริมการพัฒนารากและการสังเคราะห์แสง\n4. **ปรับปรุงโครงสร้างดิน** ดินโปร่ง ร่วนซุย อุ้มน้ำได้ดี ไม่แน่นทึบ\n5. **เพิ่มความต้านทานต่อโรค** ช่วยลดความเสี่ยงจากโรคพืช เช่น โรครากเน่า โคนเน่า\n6. **เพิ่มประสิทธิภาพการใช้ปุ๋ย** ธาตุอาหารในปุ๋ยไม่ถูกชะล้างไปกับน้ำ"},{"id":"s6","title":"การใช้งาน","body":"ใช้หว่านปรับปรุงดิน หรือผสมกับปุ๋ยเคมีเพื่อลดต้นทุนการใช้ปุ๋ย ปลอดภัยต่อผู้ใช้และสิ่งแวดล้อม [ระบุอัตราการใช้ต่อไร่ตามฉลาก]"}],"note":null,"posters":["assets/poster-20.webp","assets/poster-21.webp","assets/poster-22.webp","assets/poster-23.webp","assets/poster-24.webp"]},{"id":"midas","cat":"agri","name":"MIDAS-888","th":"ไมดาส-888 · 3 พลังทองคำ","eyebrow":"สารเสริมประสิทธิภาพพืช","desc":"สารเสริมประสิทธิภาพพืชที่ใช้ได้ทั้งทางใบและทางดิน รวม 3 สารสำคัญ คือ ฮิวมิค สาหร่ายทะเล และฟูลวิค คืนชีวิตให้ดิน เติมพลังให้พืช","img":"assets/midas888.webp","badgeImg":"assets/organic.webp","specs":[{"label":"รูปแบบ","value":"บรรจุกล่อง"},{"label":"การใช้","value":"ทางใบและทางดิน"},{"label":"มาตรฐาน","value":"Green Industry ระดับ 3 · ISO 9001 · ISO 14001 · ฮาลาล"}],"certs":[{"src":"assets/cert-green-industry.webp","alt":"Green Industry กระทรวงอุตสาหกรรม อุตสาหกรรมสีเขียวระดับที่ 3 การรับรองเลขที่ 3-0579/2565"},{"src":"assets/cert-iso.webp","alt":"BSCIC, JAS-ANZ ISO 9001 Registered, IAS Accredited, ISO 14001 Certified"},{"src":"assets/cert-fti.webp","alt":"สภาอุตสาหกรรมแห่งประเทศไทย (ส.อ.ท. / F.T.I.)"}],"summaryTitle":"สรุปสั้น ๆ จำ 3 ข้อนี้","summary":["จำว่า “3 พลังทองคำ” คือ Humic 40% Seaweed 30% Fulvic 30%","เด่นเรื่องฟื้นฟูดินและกระตุ้นรากใหม่","ใช้ได้กับพืชทุกระยะ ทั้งฉีดพ่นทางใบและให้ทางดิน"],"sections":[{"id":"s1","title":"ส่วนประกอบสำคัญ","body":"- **Humic Acid 40%** ช่วยฟื้นฟูดิน เพิ่มอินทรียวัตถุ และช่วยอุ้มธาตุอาหาร\n- **Seaweed Extract 30%** สาหร่ายทะเลธรรมชาติ ช่วยกระตุ้นการเจริญเติบโตของพืช\n- **Fulvic Acid 30%** ช่วยนำพาธาตุอาหารเข้าสู่พืช ดูดซึมได้ไวขึ้น"},{"id":"s2","title":"คุณประโยชน์เด่น","body":"1. **ช่วยให้รากเดินดี แตกแขนงไว** กระตุ้นรากใหม่ ปรับโครงสร้างดินให้ร่วนซุย\n2. **ฟื้นฟูดินเสื่อม ดินแน่น ดินแข็ง** เพิ่มอินทรียวัตถุ ปรับปรุงคุณภาพดิน\n3. **ช่วยให้พืชดูดซึมธาตุอาหารได้ดีขึ้น** ส่งธาตุอาหารสู่ต้นได้สมบูรณ์\n4. **ใบเขียว แข็งแรง สมบูรณ์** กระตุ้นการแตกใบอ่อน ส่งเสริมให้พืชโตไว\n5. **ช่วยลดความเครียดของพืชจากสภาพอากาศ** ปรับสมดุลให้พืช\n6. **สนับสนุนการเจริญเติบโตของพืชทุกระยะ** ทั้งระบบราก ลำต้น ใบ ดอก และผล รวมถึงฟื้นต้นหลังเก็บเกี่ยว"},{"id":"s3","title":"ข้อมูลเพิ่มเติม","body":"มีฮอร์โมนในกลุ่มที่พืชต้องการในรูปแบบ NAA (ออกซิน) จากธรรมชาติ"},{"id":"s4","title":"การใช้งาน","body":"[ระบุอัตราการใช้ตามฉลาก]"}],"note":null,"posters":["assets/poster-25.webp"]},{"id":"chitosan","cat":"agri","name":"MIDAS CHITOSAN","th":"ไมดาส ไคโตซาน","eyebrow":"สารเพิ่มประสิทธิภาพพืช · ชนิดน้ำ","desc":"ไคโตซานจากธรรมชาติ ช่วยเสริมภูมิคุ้มกันพืชและเพิ่มประสิทธิภาพการดูดซึมธาตุอาหาร ให้พืชแข็งแรง ได้ผลผลิตคุณภาพ","img":"assets/chitosan.webp","badgeImg":"","specs":[{"label":"รูปแบบ","value":"ชนิดน้ำ ฝาส้ม"},{"label":"ปริมาณสุทธิ","value":"1 ลิตร"},{"label":"มาตรฐาน","value":"Green Industry ระดับ 3 · ISO 9001 · ISO 14001 · ฮาลาล"}],"certs":[{"src":"assets/cert-green-industry.webp","alt":"Green Industry กระทรวงอุตสาหกรรม อุตสาหกรรมสีเขียวระดับที่ 3 การรับรองเลขที่ 3-0579/2565"},{"src":"assets/cert-iso.webp","alt":"BSCIC, JAS-ANZ ISO 9001 Registered, IAS Accredited, ISO 14001 Certified"},{"src":"assets/cert-fti.webp","alt":"สภาอุตสาหกรรมแห่งประเทศไทย (ส.อ.ท. / F.T.I.)"}],"summaryTitle":"สรุปสั้น ๆ จำ 3 ข้อนี้","summary":["เด่นเรื่อง “เสริมเกราะป้องกัน” ให้พืชแข็งแรง ต้านทานโรคและแมลง","ไคโตซาน 15% พร้อมไกลซีน กรดซิตริก และวิตามินซี","ใช้เป็นสารจับใบได้ เมื่อผสมกับสารป้องกันกำจัดศัตรูพืช"],"sections":[{"id":"s1","title":"ส่วนประกอบสำคัญ","body":"- **Chitosan 15%** ไคโตซานจากธรรมชาติ กระตุ้นภูมิคุ้มกันพืช เสริมความแข็งแรง\n- **Glycine 6.5%** กรดอะมิโนจำเป็นต่อพืช ช่วยเร่งการเจริญเติบโตและซ่อมแซมเนื้อเยื่อ\n- **Citric Acid 8.5%** กรดซิตริก ช่วยปรับสภาพดินและเพิ่มการละลายธาตุอาหาร\n- **Ascorbic Acid**\n  1,500 มก.: วิตามินซี ช่วยเสริมภูม ยเสริมสร้างความแข็งแรง และช่วยให้พืชทนต่อสภาพแวดล้อม\n- **Fulvic Acid 5.5%** ช่วยนำพาธาตุอาหารเข้าสู่พืช เสริมการดูดซึมให้มีประสิทธิภาพ"},{"id":"s2","title":"คุณประโยชน์เด่น","body":"1. **เร่งการเจริญเติบโต** พืชโตไว แตกใบอ่อน ลำต้นแข็งแรง\n2. **กระตุ้นการออกดอก ติดผล** ช่วยเพิ่มจำนวนดอกและการติดผลที่สมบูรณ์\n3. **เสริมสร้างรากให้แข็งแรง** รากเดินดี แตกแขนงมาก ดูดซึมอาหารได้ดีขึ้น\n4. **เพิ่มคุณภาพผลผลิต** ผลใหญ่ น้ำหนักดี สีสวย รสชาติดีขึ้น\n5. **เพิ่มความทนทานต่อสภาพแวดล้อม** ช่วยให้พืชทนแล้ง ทนร้อน ลดความเครียดจากสภาพอากาศ\n6. **ฟื้นฟูต้นหลังเก็บเกี่ยว** พืชฟื้นตัวเร็ว พร้อมออกผลผลิตรุ่นต่อไป"},{"id":"s3","title":"การใช้งาน","body":"[ระบุอัตราการใช้ต่อน้ำ 20 ลิตรตามฉลาก]"}],"note":null,"posters":["assets/poster-27.webp"]},{"id":"nano","cat":"agri","name":"SUPER AMINO NANO","th":"ซุปเปอร์ อะมิโน นาโน · อะมิโนคีเลต","eyebrow":"สารเพิ่มประสิทธิภาพพืช · ชนิดน้ำ","desc":"ธาตุอาหารเสริมในรูปอะมิโนคีเลต ผลิตด้วยเทคโนโลยีนาโน ซึมเข้าสู่พืชได้เร็วและสูญเสียน้อย ฉีดได้เกือบทุกระยะของพืช","img":"assets/nano.webp","badgeImg":"","specs":[{"label":"รูปแบบ","value":"ชนิดน้ำ"},{"label":"อัตราใช้","value":"15–20 ซีซี ต่อน้ำ 20 ลิตร"},{"label":"ความถี่","value":"ทุก 7–10 วัน"},{"label":"มาตรฐาน","value":"Green Industry ระดับ 3 · ISO 9001 · ISO 14001 · ฮาลาล"}],"certs":[{"src":"assets/cert-green-industry.webp","alt":"Green Industry กระทรวงอุตสาหกรรม อุตสาหกรรมสีเขียวระดับที่ 3 การรับรองเลขที่ 3-0579/2565"},{"src":"assets/cert-iso.webp","alt":"BSCIC, JAS-ANZ ISO 9001 Registered, IAS Accredited, ISO 14001 Certified"},{"src":"assets/cert-fti.webp","alt":"สภาอุตสาหกรรมแห่งประเทศไทย (ส.อ.ท. / F.T.I.)"}],"summaryTitle":"สรุปสั้น ๆ จำ 3 ข้อนี้","summary":["รวม 2 พลัง คือ นาโน = เร็ว และ คีเลต = คุ้ม","มีธาตุอาหารรอง-เสริม 5 ชนิด: Ca, Mg, Fe, Zn, B","ใช้ 15–20 ซีซี ต่อน้ำ 20 ลิตร ฉีดพ่นทุก 7–10 วัน ในช่วงเช้าหรือหลัง 5 โมงเย็น"],"sections":[{"id":"s1","title":"ทำไมต้อง “นาโน” และ “คีเลต”","body":"- **นาโน (Nano) เน้นความเร็ว**\n  คืออะไร: การย่อขนาดอนุภาคของสารอาหารให้เล็กระดับนาโนเมตร เล็ /* ---------- text format ---------- */
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\[(ระบุ[^\]]*)\]/g,'<span class="ph-fill">$1</span>')}
function itemHTML(raw,sub){
  var m=raw.match(/^\*\*(.+?)\*\*\s*(.*)$/), h;
  if(m)h='<span class="tt">'+inline(m[1])+"</span>"+(m[2]?'<span class="dd">'+inline(m[2])+"</span>":"");
  else h='<span>'+inline(raw)+"</span>";
  sub.forEach(function(s){var k=s.indexOf(": ");h+='<span class="sub">'+(k>0?"<b>"+inline(s.slice(0,k))+"</b> "+inline(s.slice(k+2)):inline(s))+"</span>"});
  return h;
}
function prose(txt,sec){
  var lines=String(txt||"").split(/\r?\n/),out=[],list=null,para=[],n=0;
  function flushP(){if(para.length){out.push("<p>"+para.map(inline).join("<br>")+"</p>");para=[]}}
  function flushL(){if(!list)return;out.push("<"+list.t+">"+list.items.map(function(it,i){
    var mk;
    var ix=n;if(sec&&sec.sprite&&list.t==="ul")n++;
    if(sec&&sec.sprite&&list.t==="ul"&&(sec.spriteN==null||ix<sec.spriteN)){mk='<span class="ing" aria-hidden="true" style="background-image:url(\''+esc(sec.sprite)+'\');background-position:-'+(ix*46)+'px 0"></span>'}
    else mk='<span class="mk" aria-hidden="true">'+(list.t==="ol"?(i+1):"")+"</span>";
    return "<li>"+mk+'<span class="tx">'+itemHTML(it.t,it.sub)+"</span></li>"}).join("")+"</"+list.t+">");list=null}
  lines.forEach(function(l){
    var m;
    if(/^\s*$/.test(l)){flushP();flushL();return}
    if(list&&/^\s{2,}\S/.test(l)){list.items[list.items.length-1].sub.push(l.trim());return}
    if((m=l.match(/^\s*[-•]\s+(.*)$/))){flushP();if(!list||list.t!=="ul"){flushL();list={t:"ul",items:[]}}list.items.push({t:m[1],sub:[]});return}
    if((m=l.match(/^\s*\d+[.)]\s+(.*)$/))){flushP();if(!list||list.t!=="ol"){flushL();list={t:"ol",items:[]}}list.items.push({t:m[1],sub:[]});return}
    flushL();para.push(l);
  });
  flushP();flushL();
  return '<div class="prose">'+out.join("")+"</div>";
}

/* ---------- images ---------- */
function pickFiles(multi){return new Promise(function(res){var i=document.createElement("input");i.type="file";i.accept="image/*";i.multiple=!!multi;i.style.display="none";document.body.appendChild(i);i.addEventListener("change",function(){var f=Array.prototype.slice.call(i.files||[]);i.remove();res(f)});i.click()})}
function shrink(file){
  return new Promise(function(res){
    if(!/^image\/(jpeg|png|webp)$/.test(file.type)||!window.createImageBitmap){res(file);return}
    createImageBitmap(file).then(function(bm){
      var max=1600,s=Math.min(1,max/Math.max(bm.width,bm.height));
      if(s===1&&file.size<700000){res(file);return}
      var c=document.createElement("canvas");c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);
      c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
      c.toBlob(function(b){res(b&&b.size<file.size?b:file)},"image/webp",0.86);
    },function(){res(file)});
  });
}
function upload(files){
  if(!assets){toast("อัปโหลดรูปได้เฉพาะเจ้าของเว็บที่เปิดผ่านบัญชีของตัวเอง");return Promise.resolve([])}
  toast("กำลังอัปโหลดรูป…",60000);
  return files.reduce(function(chain,f){return chain.then(function(out){return shrink(f).then(function(b){return assets.upload(b)}).then(function(r){out.push(r.url);return out},function(e){toast("อัปโหลด "+f.name+" ไม่สำเร็จ"+(e&&e.code==="too_large"?" (ไฟล์ใหญ่เกิน 20 MB)":""));return out})})},Promise.resolve([]))
    .then(function(urls){if(urls.length)toast("อัปโหลดแล้ว "+urls.length+" รูป");return urls});
}

function lightbox(srcs,start){
  var d=document.createElement("div");d.className="lb";d.setAttribute("role","dialog");d.setAttribute("aria-label","ภาพขนาดใหญ่");
  d.innerHTML='<div class="lb-top"><span id="lb-n"></span><button class="icon-btn" data-x aria-label="ปิด">'+ic("x")+'</button></div><div class="lb-track">'+srcs.map(function(s){return '<figure><img src="'+esc(s)+'" alt=""></figure>'}).join("")+"</div>";
  document.body.appendChild(d);
  var tr=d.querySelector(".lb-track"),n=d.querySelector("#lb-n");
  function upd(){var i=Math.round(tr.scrollLeft/tr.clientWidth);n.textContent=(i+1)+" / "+srcs.length}
  tr.scrollLeft=start*tr.clientWidth;upd();tr.addEventListener("scroll",upd,{passive:true});
  function close(){d.remove();document.removeEventListener("keydown",key)}
  function key(e){if(e.key==="Escape")close();if(e.key==="ArrowRight")tr.scrollBy({left:tr.clientWidth,behavior:"smooth"});if(e.key==="ArrowLeft")tr.scrollBy({left:-tr.clientWidth,behavior:"smooth"})}
  document.addEventListener("keydown",key);
  d.addEventListener("click",function(e){if(e.target.closest("[data-x]")||e.target.tagName==="FIGURE")close()});
}

function sheet(o){
  var ov=document.createElement("div");ov.className="overlay";
  function fieldHTML(f){
    var v=o.values[f.key]==null?"":o.values[f.key],id="f-"+f.key,ctl;
    if(f.type==="textarea")ctl='<textarea id="'+id+'" name="'+f.key+'" rows="'+(f.rows||6)+'"'+(f.ph?' placeholder="'+esc(f.ph)+'"':"")+">"+esc(v)+"</textarea>";
    else if(f.type==="select")ctl='<select id="'+id+'" name="'+f.key+'">'+f.options.map(function(op){return '<option value="'+esc(op[0])+'"'+(op[0]===v?" selected":"")+">"+esc(op[1])+"</option>"}).join("")+"</select>";
    else if(f.type==="image")ctl='<div class="imgfield"><span class="pv" data-pv="'+f.key+'">'+(v?'<img src="'+esc(v)+'" alt="">':ic("img"))+'</span><input type="hidden" name="'+f.key+'" value="'+esc(v)+'"><div class="row"><button type="button" class="btn btn-soft btn-sm" data-pick="'+f.key+'">'+ic("img")+'เลือกรูป</button><button type="button" class="btn btn-ghost btn-sm" data-clear="'+f.key+'">ไม่ใช้รูป</button></div></div>';
    else ctl='<input id="'+id+'" name="'+f.key+'" type="'+(f.type||"text")+'" value="'+esc(v)+'"'+(f.ph?' placeholder="'+esc(f.ph)+'"':"")+">";
    return '<div class="field"><label for="'+id+'">'+esc(f.label)+"</label>"+ctl+(f.hint?'<span class="hint">'+f.hint+"</span>":"")+"</div>";
  }
  ov.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><div class="sheet-h"><h2 id="sh-t">'+esc(o.title)+'</h2><button class="icon-btn" data-x aria-label="ปิด">'+ic("x")+'</button></div><form class="sheet-b">'+
    o.fields.map(function(f){return f.row?'<div class="two">'+f.row.map(fieldHTML).join("")+"</div>":fieldHTML(f)}).join("")+
    '</form><div class="sheet-f">'+(o.onDelete?'<button class="btn btn-danger btn-sm" data-del>'+ic("trash")+"ลบ</button>":"")+'<span class="sp"></span><button class="btn btn-ghost btn-sm" data-x>ยกเลิก</button><button class="btn btn-primary btn-sm" data-ok>'+ic("check")+"ตกลง</button></div></div>";
  document.body.appendChild(ov);
  function close(){ov.remove();document.removeEventListener("keydown",key)}
  function key(e){if(e.key==="Escape")close()}
  document.addEventListener("keydown",key);
  var armed=false;
  ov.addEventListener("click",function(e){
    if(e.target===ov||e.target.closest("[data-x]")){close();return}
    var pk=e.target.closest("[data-pick]");
    if(pk){var k=pk.getAttribute("data-pick");pickFiles(false).then(function(f){return f.length?upload(f):[]}).then(function(u){if(!u.length)return;ov.querySelector('[name="'+k+'"]').value=u[0];ov.querySelector('[data-pv="'+k+'"]').innerHTML='<img src="'+esc(u[0])+'" alt="">'});return}
    var cl=e.target.closest("[data-clear]");
    if(cl){var k2=cl.getAttribute("data-clear");ov.querySelector('[name="'+k2+'"]').value="";ov.querySelector('[data-pv="'+k2+'"]').innerHTML=ic("img");return}
    if(e.target.closest("[data-ok]")){var v={};ov.querySelectorAll("[name]").forEach(function(el){v[el.name]=el.value.trim()});var err=o.validate&&o.validate(v);if(err){toast(err);return}o.onSave(v);close();return}
    var d=e.target.closest("[data-del]");
    if(d){if(!armed){armed=true;d.textContent="แตะอีกครั้งเพื่อยืนยันการลบ";return}o.onDelete();close()}
  });
  ov.querySelector("form").addEventListener("submit",function(e){e.preventDefault()});
}
var FMT='เว้นบรรทัดว่าง = ย่อหน้าใหม่ · <b>- </b> = รายการ · <b>1. </b> = ลำดับ · <b>**คำ**</b> = ตัวหนา · เว้น 2 ช่องหน้าบรรทัด = รายละเอียดย่อยของรายการก่อนหน้า';
function lines(a){return a.map(function(x){return x.label+": "+x.value}).join("\n")}
function parseLines(s){return String(s||"").split(/\r?\n/).map(function(l){var i=l.indexOf(":");if(i<0)return l.trim()?{label:l.trim(),value:""}:null;return{label:l.slice(0,i).trim(),value:l.slice(i+1).trim()}}).filter(Boolean)}
function mutate(fn){fn(data);dirty=true;store(DRAFT,JSON.stringify(data));render()}
function move(a,i,dir){var j=i+dir;if(i<0||j<0||j>=a.length)return;var t=a[i];a[i]=a[j];a[j]=t}
function secOf(key){var k=key.split("/"),p=prod(k[0]);return{p:p,i:p?p.sections.findIndex(function(s){return s.id===k[1]}):-1}}

/* ---------- actions ---------- */
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b||!app.contains(b))return;
  var act=b.getAttribute("data-act"),id=b.getAttribute("data-id"),p,s;
  switch(act){
  case"fs":fsIdx=Math.max(0,Math.min(3,fsIdx+(+b.getAttribute("data-dir"))));store(FS,String(fsIdx));applyFs();render();break;
  case"toggle-edit":editing=!editing;render();break;
  case"toggle-sec":ui.open[id]=!ui.open[id];render();break;
  case"toggle-all":p=prod(id);var all=p.sections.every(function(x){return ui.open[p.id+"/"+x.id]});p.sections.forEach(function(x){ui.open[p.id+"/"+x.id]=!all});render();break;
  case"lightbox":p=prod(id);lightbox(p.posters,+b.getAttribute("data-i"));break;
  case"lightbox-promo":s=data.promos.find(function(x){return x.id===id});if(s&&s.img)lightbox([s.img],0);break;
  case"promo-filter":ui.promoFilter=id;render();break;
  case"copy":copy(b.getAttribute("data-text"));break;
  case"edit-meta":sheet({title:"หัวเว็บและคำแนะนำ",values:data.meta,fields:[{row:[{key:"brand",label:"ชื่อแบรนด์"},{key:"sub",label:"คำใต้ชื่อ"}]},{key:"logo",label:"โลโก้",type:"image"},{key:"kicker",label:"ข้อความเล็กเหนือหัวข้อ"},{key:"title",label:"หัวข้อหน้าแรก"},{key:"intro",label:"คำแนะนำ",type:"textarea",rows:3},{key:"badge",label:"ป้ายเด่น",ph:"มาตรฐานฮาลาลทุกรายการ"},{key:"footer",label:"ข้อความท้ายหน้า",type:"textarea",rows:3}],
    onSave:function(v){mutate(function(d){Object.assign(d.meta,v)})}});break;
  case"add-product":case"edit-product":
    p=act==="edit-product"?prod(id):{cat:id,name:"",th:"",eyebrow:"",desc:"",specs:[],summary:[],note:null,summaryTitle:"สรุปสั้น ๆ จำ 3 ข้อนี้"};
    sheet({title:act==="add-product"?"เพิ่มสินค้า":"แก้ไขข้อมูลหลัก",values:{name:p.name,th:p.th,eyebrow:p.eyebrow,cat:p.cat,desc:p.desc,img:p.img||"",specs:lines(p.specs),summaryTitle:p.summaryTitle,summary:p.summary.join("\n"),noteTitle:p.note?p.note.title:"ข้อควรระวังเวลาแนะนำสินค้า",noteText:p.note?p.note.text:""},
      fields:[{key:"name",label:"ชื่อสินค้า"},{key:"th",label:"ชื่ออ่านภาษาไทย"},{row:[{key:"cat",label:"หมวด",type:"select",options:data.cats.map(function(c){return[c.id,c.name]})},{key:"eyebrow",label:"ประเภท",ph:"ผลิตภัณฑ์เสริมอาหาร"}]},
        {key:"img",label:"รูปสินค้า",type:"image"},{key:"desc",label:"คำอธิบายสั้น",type:"textarea",rows:3},{key:"specs",label:"ข้อมูลสินค้า (บรรทัดละ 1 ข้อ แบบ ชื่อ: ค่า)",type:"textarea",rows:5,ph:"รูปแบบ: ผงชงดื่ม"},
        {key:"summaryTitle",label:"หัวข้อสรุป"},{key:"summary",label:"สรุปสั้น ๆ (บรรทัดละ 1 ข้อ)",type:"textarea",rows:4},{key:"noteTitle",label:"หัวข้อข้อควรระวัง"},{key:"noteText",label:"ข้อควรระวัง (เว้นว่างได้)",type:"textarea",rows:3}],
      validate:function(v){return v.name?"":"กรุณาใส่ชื่อสินค้า"},
      onSave:function(v){mutate(function(d){
        var x=act==="add-product"?{id:uid("x"),certs:[],sections:[],posters:[],badgeImg:""}:d.products.find(function(y){return y.id===id});
        x.name=v.name;x.th=v.th;x.cat=v.cat;x.eyebrow=v.eyebrow;x.desc=v.desc;x.img=v.img;x.specs=parseLines(v.specs);x.summaryTitle=v.summaryTitle;
        x.summary=v.summary.split(/\r?\n/).map(function(t){return t.trim()}).filter(Boolean);x.note=v.noteText?{title:v.noteTitle,text:v.noteText}:null;
        if(act==="add-product"){d.products.push(x);setTimeout(function(){location.hash="p-"+x.id},0)}
      })},
      onDelete:act==="edit-product"?function(){mutate(function(d){d.products=d.products.filter(function(y){return y.id!==id})});location.hash="products"}:null});break;
  case"move-product":mutate(function(d){move(d.products,d.products.findIndex(function(y){return y.id===id}),+b.getAttribute("data-dir"))});break;
  case"pick-img":pickFiles(false).then(function(f){return f.length?upload(f):[]}).then(function(u){if(u.length)mutate(function(){prod(id).img=u[0]})});break;
  case"add-poster":pickFiles(true).then(function(f){return f.length?upload(f):[]}).then(function(u){if(u.length)mutate(function(){var x=prod(id);x.posters=x.posters.concat(u)})});break;
  case"move-poster":mutate(function(){move(prod(id).posters,+b.getAttribute("data-i"),+b.getAttribute("data-dir"))});break;
  case"del-poster":if(b.getAttribute("data-armed")){mutate(function(){prod(id).posters.splice(+b.getAttribute("data-i"),1)})}else{b.setAttribute("data-armed","1");b.style.background="#c2334a";b.style.color="#fff";toast("แตะถังขยะอีกครั้งเพื่อลบรูปนี้")}break;
  case"add-sec":case"edit-sec":
    var so=act==="edit-sec"?secOf(id):{p:prod(id),i:-1};s=so.i>=0?so.p.sections[so.i]:{title:"",body:"",img:""};
    sheet({title:act==="add-sec"?"เพิ่มหัวข้อ":"แก้ไขหัวข้อ",values:s,fields:[{key:"title",label:"ชื่อหัวข้อ"},{key:"img",label:"รูปประกอบ (ถ้ามี)",type:"image"},{key:"body",label:"เนื้อหา",type:"textarea",rows:12,hint:FMT}],
      validate:function(v){return v.title?"":"กรุณาใส่ชื่อหัวข้อ"},
      onSave:function(v){mutate(function(){if(so.i<0){var nid=uid("s");so.p.sections.push({id:nid,title:v.title,body:v.body,img:v.img});ui.open[so.p.id+"/"+nid]=true}else{Object.assign(so.p.sections[so.i],{title:v.title,body:v.body,img:v.img})}})},
      onDelete:so.i>=0?function(){mutate(function(){so.p.sections.splice(so.i,1)})}:null});break;
  case"move-sec":var sm=secOf(id);mutate(function(){move(sm.p.sections,sm.i,+b.getAttribute("data-dir"))});break;
  case"add-promo":case"edit-promo":
    s=act==="edit-promo"?data.promos.find(function(x){return x.id===id}):{badge:"",title:"",detail:"",start:"",end:"",code:"",cond:"",img:"",product:""};
    sheet({title:act==="add-promo"?"เพิ่มโปรโมชั่น":"แก้ไขโปรโมชั่น",values:s,fields:[{key:"img",label:"รูปโปรโมชั่น",type:"image",hint:"ถ้าไม่ใส่รูป จะแสดงข้อความเด่นบนแถบสีม่วงแทน"},{key:"badge",label:"ข้อความเด่น",ph:"ลด 20%"},{key:"title",label:"ชื่อโปรโมชั่น"},{key:"detail",label:"รายละเอียด",type:"textarea",rows:3},
      {row:[{key:"start",label:"วันเริ่ม",type:"date"},{key:"end",label:"วันสิ้นสุด",type:"date"}]},{key:"product",label:"สินค้าที่ร่วมรายการ",type:"select",options:[["","ไม่ระบุ"]].concat(data.products.map(function(x){return[x.id,x.name]}))},
      {key:"code",label:"โค้ดส่วนลด (ถ้ามี)"},{key:"cond",label:"เงื่อนไข",type:"textarea",rows:4,hint:FMT}],
      validate:function(v){if(!v.title)return"กรุณาใส่ชื่อโปรโมชั่น";if(v.start&&v.end&&v.end<v.start)return"วันสิ้นสุดต้องไม่ก่อนวันเริ่ม";return""},
      onSave:function(v){mutate(function(d){if(act==="add-promo"){v.id=uid("p");d.promos.unshift(v);ui.promoFilter="all"}else Object.assign(d.promos.find(function(y){return y.id===id}),v)})},
      onDelete:act==="edit-promo"?function(){mutate(function(d){d.promos=d.promos.filter(function(y){return y.id!==id})})}:null});break;
  case"move-promo":mutate(function(d){move(d.promos,d.promos.findIndex(function(y){return y.id===id}),+b.getAttribute("data-dir"))});break;
  case"discard":data=clone(published);dirty=false;store(DRAFT,null);toast("ยกเลิกการแก้ไขแล้ว");render();break;
  case"restore":try{data=JSON.parse(load(DRAFT));dirty=true;editing=true;render();toast("กู้คืนฉบับร่างแล้ว")}catch(err){store(DRAFT,null)}break;
  case"publish":publish();break;
  }
});
document.addEventListener("input",function(e){if(e.target.id==="q"){ui.q=e.target.value;renderGrid()}});

function copy(t){
  function ok(){toast("คัดลอกแล้ว: "+t)}
  function fb(){var ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();var done=false;try{done=document.execCommand("copy")}catch(e){}ta.remove();if(done)ok();else toast("คัดลอกไม่ได้ กดค้างที่โค้ดเพื่อคัดลอกเอง")}
  try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}
}
var tt;
function toast(m,ms){var o=document.querySelector(".toast");if(o)o.remove();var d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.textContent=m;document.body.appendChild(d);clearTimeout(tt);tt=setTimeout(function(){d.remove()},ms||2800)}

/* ---------- publish: rebuild the whole page with the new data ---------- */
function buildHTML(){
  var hs=document.head&&document.head.querySelector("style");
  var reset=hs?hs.textContent:":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}";
  var json=JSON.stringify(data).split("<").join(String.fromCharCode(92)+"u003c");
  var SC="<"+"/script>";
  var fonts='<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+"</style></head><body>"+
    '<title>คู่มือศึกษาสินค้า SPR99</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+fonts+"\n"+document.getElementById("page-style").outerHTML+
    '\n<div id="app"></div>\n<script type="application/json" id="state">'+json+SC+"\n"+document.getElementById("app-js").outerHTML+"</body></html>";
}
function publish(){
  if(!art||saving)return;
  data.meta.updated=new Date().toISOString().slice(0,10);
  saving=true;render();
  art.publish(buildHTML()).then(function(){store(DRAFT,null);dirty=false;saving=false;published=clone(data);toast("เผยแพร่แล้ว ทุกคนจะเห็นข้อมูลใหม่");render()},
  function(err){saving=false;var c=err&&err.code;
    if(c==="conflict")toast("มีเวอร์ชันใหม่กว่าถูกบันทึกไปก่อน หน้าจะโหลดใหม่ ฉบับร่างของคุณยังเก็บไว้");
    else if(c==="not_writer"||c==="not_granted"){canEdit=false;editing=false;dirty=false;toast("บัญชีนี้ดูได้อย่างเดียว แก้ไขไม่ได้")}
    else if(c==="rate_limited")toast("บันทึกถี่เกินไป รอสักครู่แล้วลองใหม่");
    else if(c==="too_large")toast("ข้อมูลใหญ่เกินไป ลองลดจำนวนรูปหรือข้อความ");
    else toast("บันทึกไม่สำเร็จ ลองกดบันทึกอีกครั้ง");
    render()});
}

/* ---------- boot ---------- */
render();
(function(){
  if(!window.claude||typeof window.claude.use!=="function")return;
  Promise.all([window.claude.use("user"),window.claude.use("artifact"),window.claude.use("assets")]).then(function(r){
    var u=r[0];art=r[1];assets=r[2];
    if(!u||!art)return;
    return u.canEdit().then(function(ok){
      if(!ok)return;
      canEdit=true;
      var d=load(DRAFT);
      render();
      if(d&&d!==JSON.stringify(published)){
        var n=document.createElement("div");n.className="editbar";n.style.marginBottom="16px";n.style.alignItems="center";
        n.innerHTML='<span style="flex:1;font-weight:500;color:var(--accent-ink)">มีฉบับร่างที่ยังไม่ได้เผยแพร่ค้างไว้</span><button class="btn btn-primary btn-sm" data-act="restore">กู้คืน</button>';
        var w=app.querySelector("main .wrap");if(w)w.prepend(n);
      }else store(DRAFT,null);
    });
  }).catch(function(){});
})();
})();
</script>
